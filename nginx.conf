server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Ceo FE sme da bude u iframe-u samo sa istog origin-a. Lokacije ispod koje definišu
    # sopstveni add_header ovo ponavljaju (nginx ne nasleđuje add_header u lokaciji koja ga ima).
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Booking widget iframe aplikacija: sme da je ugrade samo origin-i iz env liste
    # WIDGET_FRAME_ANCESTORS (razmakom odvojeni, npr. "https://demo-business.bojanlab.com").
    # `^~` da regex lokacija za statiku ispod ne pregazi ovu.
    location ^~ /widget/ {
        add_header Content-Security-Policy "frame-ancestors ${WIDGET_FRAME_ANCESTORS}" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /widget/index.html;
    }

    location ^~ /widget/assets/ {
        add_header Content-Security-Policy "frame-ancestors ${WIDGET_FRAME_ANCESTORS}" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Loader je javni ugovor sa stabilnim imenom, bez hash-a: kratak keš (ne `immutable`).
    location = /widget.js {
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
