name: PR check

# Lint + testovi + build na svakom PR-u. PR ka main proverava sve: to je
# jedini automatski signal da je epic grana zdrava pre nego što se spoji u main
# (branch protection nije dostupan na Free planu za privatan repo, pa se merge
# oslanja na ovaj check i na tvoj pregled).
#
# PR sloja ka epic grani proverava samo module koje dira i ono od čega oni
# zavise (scripts/ci/scoped-check.sh). Kad modules/domain promeni postojeći
# tip, ostali moduli ne prolaze tsc dok ih child tiketi ne prilagode, a ti
# tiketi se otvaraju tek posle merge-a domain PR-a.
#
# Namerno NE deployuje ništa — deploy-staging.yml se i dalje okida samo na push
# u main.

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      # Checkout PR-a je merge commit (base + PR), pa diff prema vrhu base
      # grane daje tačno izmene iz PR-a. Istorija nije potrebna, samo stablo.
      - name: Fetch base
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      # Lint, testovi, build i e2e typecheck — koliko od toga, zavisi od diff-a.
      - name: Check
        run: scripts/ci/scoped-check.sh "origin/${GITHUB_BASE_REF}"
